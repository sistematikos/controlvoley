<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Gestión de Atletas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f0f6ff', 100: '#e0edff', 500: '#0066ff', 600: '#0052cc', 700: '#003db3',
                electric: '#0055FF', cyan: '#00D2FF', dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)'
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }

        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .banner-glow {
            position: relative;
        }

        .banner-glow::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 5%;
            width: 90%;
            height: 30px;
            background: linear-gradient(90deg, #0055FF, #00D2FF);
            filter: blur(20px);
            opacity: 0.35;
            z-index: -1;
            border-radius: 50%;
        }

        .row-atleta:hover {
            background-color: #f0f6ff;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen flex flex-col justify-between text-slate-800 antialiased p-3 sm:p-6" oncontextmenu="return false">

    <div class="max-w-6xl mx-auto w-full space-y-6">
        
        <!-- BOTÓN VOLVER Y CORREO/ESTADO -->
        <div class="flex items-center justify-between">
            <a href="index_menu.html" class="px-4 py-2 bg-white/80 hover:bg-white text-slate-700 rounded-xl font-bold text-xs shadow-sm flex items-center gap-2 transition border border-slate-200">
                <i class="fas fa-arrow-left"></i> Volver al Menú
            </a>
            <span id="userEmail" class="text-xs font-bold text-slate-500">
                <span class="w-2 h-2 rounded-full bg-amber-500 inline-block animate-pulse"></span> Cargando club...
            </span>
        </div>

        <!-- BANNER SUPERIOR CON GLOW Y DEGRADADO -->
        <div class="banner-glow mb-2">
            <div class="rounded-3xl overflow-hidden shadow-2xl relative border border-white/60 bg-slate-950">
                <!-- Imagen de Fondo -->
                <img src="img/banner.png" alt="Control Voley Banner" class="w-full h-36 sm:h-44 object-cover opacity-80" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1600&auto=format&fit=crop'">
                
                <!-- Degradado y Texto Encima de la Imagen -->
                <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-transparent flex flex-col justify-center px-6 sm:px-10">
                    <!-- Subtítulo o Módulo -->
                    <span class="text-sky-400 text-xs font-extrabold uppercase tracking-widest flex items-center gap-2 mb-1">
                        <i class="fas fa-users-gear"></i> Módulo de Gestión
                    </span>
                    <!-- Título Principal -->
                    <h1 class="text-2xl sm:text-3xl font-black text-white leading-tight">
                        Gestión de Atletas <span class="text-[10px] bg-brand-electric text-white px-2 py-0.5 rounded-md font-bold ml-1">PRO</span>
                    </h1>
                    <!-- Descripción -->
                    <p class="text-slate-300 text-xs sm:text-sm mt-1 font-medium">
                        Administración, nómina oficial y estatus operativo de atletas.
                    </p>
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="space-y-6">
            
            <!-- 1. FORMULARIO DE REGISTRO / EDICIÓN -->
            <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-glass border border-slate-200/80 space-y-5">
                <div class="flex justify-between items-center border-b border-slate-200/60 pb-3">
                    <h3 id="fT" class="text-xs font-black uppercase tracking-wider text-brand-electric flex items-center gap-2">
                        <i class="fas fa-user-plus text-brand-electric"></i> Registrar Nuevo Atleta
                    </h3>
                    <button type="button" onclick="resetForm()" id="bC" class="hidden text-xs font-bold text-slate-400 hover:text-slate-700 uppercase tracking-wider">Cancelar Edición</button>
                </div>

                <form id="aForm" class="space-y-4">
                    <input type="hidden" id="aId">
                    <input type="hidden" id="fotoUrlActual">

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Foto del Atleta</label>
                            <input type="file" id="fotoAtleta" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-50 file:text-brand-electric hover:file:bg-brand-100 file:cursor-pointer border border-slate-200 rounded-xl p-1 bg-white">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Cédula de Identidad *</label>
                            <input type="text" id="cedulaIdentidad" required placeholder="Ej: V-28123456" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Teléfono</label>
                            <input type="text" id="telefono" placeholder="0412-1234567" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre *</label>
                            <input type="text" id="nombre" required placeholder="Nombre" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Apellido *</label>
                            <input type="text" id="apellido" required placeholder="Apellido" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <!-- FECHA NACIMIENTO, SEDE SISTEMA, SEDE CLUB MANUAL, CATEGORÍA Y ESTATUS -->
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Fecha Nacimiento</label>
                            <input type="date" id="fechaNacimiento" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Sede (Sistema)</label>
                            <select id="sede" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                                <option value="Principal">Principal</option>
                                <option value="Norte">Norte</option>
                                <option value="Este">Este</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Sede Club (Manual)</label>
                            <input type="text" id="sedeClub" placeholder="Ej: Gimnasio Cubierto" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Categoría</label>
                            <select id="categoria" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                                <option value="U13">U13</option>
                                <option value="U15" selected>U15</option>
                                <option value="U17">U17</option>
                                <option value="U19">U19</option>
                                <option value="Libre">Libre</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Estatus</label>
                            <select id="estatus" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-emerald-700 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                                <option value="Activo" selected>Activo</option>
                                <option value="Inactivo">Inactivo</option>
                                <option value="Retirado">Retirado</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Nro. Camiseta</label>
                            <input type="text" id="nroCamiseta" placeholder="10" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Peso (kg)</label>
                            <input type="number" step="0.1" id="peso" placeholder="60" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Altura (m)</label>
                            <input type="number" step="0.01" id="talla" placeholder="1.75" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <hr class="border-slate-200">

                    <div class="space-y-3">
                        <h4 class="text-[11px] font-black uppercase tracking-wider text-slate-700">Datos del Representante</h4>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre Representante</label>
                            <input type="text" id="nombreRepresentante" placeholder="Nombre completo" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Cédula Rep.</label>
                                <input type="text" id="cedulaRepresentante" placeholder="V-12345678" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Teléfono Rep.</label>
                                <input type="text" id="telefonoRepresentante" placeholder="0414-1234567" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Frecuencia</label>
                            <select id="frecuenciaPago" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                                <option value="mensual">Mensual</option>
                                <option value="semanal">Semanal</option>
                                <option value="anual">Anual</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Monto ($)</label>
                            <input type="number" step="0.01" id="montoPago" placeholder="20.00" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-600 mb-1">Último Pago</label>
                            <input type="date" id="fechaUltimoPago" class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <button type="submit" id="bS" class="w-full py-4 px-4 bg-brand-electric hover:bg-brand-600 text-white font-black rounded-xl shadow-electric transition text-xs uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer mt-3">
                        <i class="fas fa-save"></i> Guardar Atleta
                    </button>
                </form>
            </div>

            <!-- 2. NÓMINA DE ATLETAS -->
            <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-glass border border-slate-200/80 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h3 class="text-sm font-black uppercase tracking-tight text-slate-900">Nómina de Atletas Registrados</h3>
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <select id="filtroSede" onchange="filterNomina()" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 shadow-sm outline-none">
                            <option value="todos">Todas las sedes</option>
                            <option value="Principal">Principal</option>
                            <option value="Norte">Norte</option>
                            <option value="Este">Este</option>
                        </select>
                        <div class="relative flex-1 sm:w-72">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fas fa-search text-xs"></i></span>
                            <input type="text" id="sAt" oninput="filterNomina()" placeholder="Buscar por cédula o nombre..." class="w-full pl-9 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-black uppercase text-slate-500 tracking-wider">
                                <th class="px-4 py-3">Atleta</th>
                                <th class="px-4 py-3">Fecha Nac.</th>
                                <th class="px-4 py-3">Cédula</th>
                                <th class="px-4 py-3">Cat.</th>
                                <th class="px-4 py-3">Sede Club</th>
                                <th class="px-4 py-3">Representante</th>
                                <th class="px-4 py-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="nTB" class="divide-y divide-slate-100 text-xs">
                            <!-- Dinámico -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="js/atletas.js"></script>
    <script>
        window.verFicha = function(id) {
            window.location.href = `index_ficha.html?id=${id}`;
        };
    </script>
</body>
</html>
