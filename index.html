<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Activación y Acceso</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#001F3F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --c1: #001F3F; --c2: #0074D9; --bg: #f0f8ff; --success: #10B981; --error: #EF4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,31,63,0.12); width: 100%; max-width: 420px; text-align: center; border-top: 8px solid var(--c1); }
        textarea, input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; outline: none; font-family: inherit; transition: 0.3s; }
        textarea { height: 90px; resize: none; font-family: monospace; font-size: 0.8rem; }
        input:focus, textarea:focus { border-color: var(--c2); }
        button { width: 100%; padding: 14px; background: var(--c1); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 12px rgba(0,31,63,0.2); }
        button:hover { background: var(--c2); transform: translateY(-1px); }
        .hidden { display: none !important; }
        .error-msg { color: var(--error); font-size: 0.8rem; font-weight: 600; margin-top: 8px; }
        .banner-logo { width: 90px; height: 90px; object-fit: contain; margin: 0 auto 15px auto; border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid var(--c2); display: flex; align-items: center; justify-content: center; background: #fff; }
    </style>

    <script>
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
        });

        // 1. VALIDACIÓN AUTOMÁTICA DE LICENCIA PREVIA
        document.addEventListener('DOMContentLoaded', () => {
            const licenciaValidada = localStorage.getItem('control_voley_licencia_validada');
            const clubID = localStorage.getItem('control_voley_club_id');

            if (licenciaValidada === 'true' && clubID) {
                document.getElementById('cardActivacion').classList.add('hidden');
                document.getElementById('cardLogin').classList.remove('hidden');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</head>
<body oncontextmenu="return false">

    <!-- TARJETA 1: ACTIVACIÓN DE LICENCIA -->
    <div class="card" id="cardActivacion">
        <div class="banner-logo">
            <i class="fas fa-volleyball-ball text-3xl" style="color: var(--c2);"></i>
        </div>
        <h2 style="color:var(--c1); margin-top: 0; font-weight: 900;">Control Voley</h2>
        <p style="color:#64748b; font-size: 0.85rem; margin-bottom: 20px;">Pega tu código de licencia para activar este dispositivo:</p>
        
        <textarea id="tokenInput" placeholder="Pega el código de licencia aquí..."></textarea>
        <button id="btnActivar">ACTIVAR SISTEMA</button>
        <p id="errActivacion" class="error-msg hidden"></p>
    </div>

    <!-- TARJETA 2: INICIO DE SESIÓN Y CREDENCIALES (Se muestra si ya está activado) -->
    <div class="card hidden" id="cardLogin">
        <div class="banner-logo">
            <i class="fas fa-user-shield text-3xl" style="color: var(--c2);"></i>
        </div>
        <h2 style="color:var(--c1); margin-top: 0; font-weight: 900;">Acceso al Sistema</h2>
        <p style="color:#64748b; font-size: 0.85rem; margin-bottom: 15px;">Ingresa tus credenciales autorizadas:</p>
        
        <form id="loginForm">
            <input type="email" id="email" placeholder="Correo electrónico..." required>
            <input type="password" id="password" placeholder="Contraseña..." required>
            <button type="submit" id="btnLogin">INICIAR SESIÓN</button>
            <p id="errLogin" class="error-msg hidden"></p>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración de la Base de Datos Principal de Control Voley
        const firebaseConfig = {
            apiKey: "AIzaSyB5RB7mm1j-0gjCNTUEJTkyEqLjyZ3C7ws",
            authDomain: "datacontrolvoley-ff556.firebaseapp.com",
            projectId: "datacontrolvoley-ff556",
            storageBucket: "datacontrolvoley-ff556.firebasestorage.app",
            messagingSenderId: "516409072606",
            appId: "1:516409072606:web:132538dba358a077d71b4f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        // --- PROCESO DE ACTIVACIÓN DE LICENCIA ---
        async function procesarActivacion() {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const errEl = document.getElementById('errActivacion');
            errEl.classList.add('hidden');

            if (!rawToken) {
                errEl.textContent = "Por favor pega el código de licencia.";
                errEl.classList.remove('hidden');
                return;
            }
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const activationId = data.activation_id;

                if (!activationId) throw new Error("Token malformado");

                const licenciaRef = doc(db, "licencias", activationId);
                const snapLicencia = await getDoc(licenciaRef);

                let equiposLicencia = [];
                let limiteLicencia = data.l || 1;

                if (snapLicencia.exists()) {
                    const dbData = snapLicencia.data();
                    equiposLicencia = Array.isArray(dbData.equipos) ? dbData.equipos : [];
                    limiteLicencia = dbData.limite || limiteLicencia;

                    if (!equiposLicencia.includes(hwID) && equiposLicencia.length >= limiteLicencia) {
                        errEl.textContent = "Error: Límite de dispositivos alcanzado en esta licencia.";
                        errEl.classList.remove('hidden');
                        return;
                    }

                    if (!equiposLicencia.includes(hwID)) {
                        equiposLicencia.push(hwID);
                        await updateDoc(licenciaRef, { equipos: equiposLicencia });
                    }
                } else {
                    equiposLicencia = [hwID];
                    await setDoc(licenciaRef, { 
                        cliente: data.n || "", 
                        limite: limiteLicencia, 
                        equipos: equiposLicencia, 
                        fecha_registro: new Date().toISOString() 
                    });
                }

                // Guardar variables de sesión de licencia
                localStorage.setItem('control_voley_club_id', activationId);
                localStorage.setItem('control_voley_licencia_validada', 'true');

                // Solicitar instalación PWA justo aquí tras activar correctamente la licencia
                if (window.deferredPrompt) {
                    window.deferredPrompt.prompt();
                    await window.deferredPrompt.userChoice;
                    window.deferredPrompt = null;
                }

                // Cambiar a la tarjeta de inicio de sesión
                document.getElementById('cardActivacion').classList.add('hidden');
                document.getElementById('cardLogin').classList.remove('hidden');

            } catch (e) {
                console.error("Error al activar:", e);
                errEl.textContent = "Código de licencia inválido o error de conexión.";
                errEl.classList.remove('hidden');
            }
        }

        document.getElementById('btnActivar').addEventListener('click', procesarActivacion);

        // --- PROCESO DE INICIO DE SESIÓN Y VERIFICACIÓN DE APROBACIÓN ---
        const loginForm = document.getElementById('loginForm');
        loginForm.onsubmit = async (e) => {
            e.preventDefault();
            const errLogin = document.getElementById('errLogin');
            const btnLogin = document.getElementById('btnLogin');
            errLogin.classList.add('hidden');
            btnLogin.disabled = true;
            btnLogin.textContent = "Verificando...";

            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Validar estatus de aprobación en la colección 'users'
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const isApproved = userData.aprobado === true || userData.status === 'approved';

                    if (isApproved) {
                        // Todo correcto: Licencia activa, sesión autenticada y usuario aprobado -> Al menú
                        window.location.replace('index_menu.html');
                    } else {
                        await signOut(auth);
                        errLogin.textContent = "Tu cuenta está pendiente de aprobación por el administrador.";
                        errLogin.classList.remove('hidden');
                        btnLogin.disabled = false;
                        btnLogin.textContent = "INICIAR SESIÓN";
                    }
                } else {
                    await signOut(auth);
                    errLogin.textContent = "No se encontraron datos de usuario asociados.";
                    errLogin.classList.remove('hidden');
                    btnLogin.disabled = false;
                    btnLogin.textContent = "INICIAR SESIÓN";
                }

            } catch (error) {
                console.error(error);
                errLogin.textContent = "Credenciales incorrectas o error de acceso.";
                errLogin.classList.remove('hidden');
                btnLogin.disabled = false;
                btnLogin.textContent = "INICIAR SESIÓN";
            }
        };
    </script>
</body>
</html>
