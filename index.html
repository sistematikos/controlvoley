<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Activación del Sistema</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f6ff',
                100: '#e0edff',
                500: '#0066ff',
                600: '#0052cc',
                700: '#003db3',
                electric: '#0055FF',
                cyan: '#00D2FF',
                dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)',
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>

    <script>
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
        });

        function esPWAInstalada() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        // VALIDACIÓN AUTOMÁTICA DE SESIÓN PREVIA -> index_menu.html
        document.addEventListener('DOMContentLoaded', () => {
            const licenciaValidada = localStorage.getItem('licencia_validada');
            const empresaID = localStorage.getItem('youcontrol_empresa_id');

            if (licenciaValidada === 'true' && empresaID && esPWAInstalada()) {
                window.location.replace('index_menu.html');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</head>
<body class="bg-sports-pattern min-h-screen flex items-center justify-center p-4 antialiased text-slate-800" oncontextmenu="return false">

    <div class="glass-card p-8 rounded-3xl shadow-glass border border-slate-200/80 w-full max-w-md text-center space-y-6">
        
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-electric to-brand-cyan flex items-center justify-center text-white shadow-electric mx-auto mb-2">
            <i class="fas fa-shield-alt text-2xl animate-pulse"></i>
        </div>

        <div>
            <h1 class="text-xl font-black text-slate-900 uppercase tracking-tight">Control Voley</h1>
            <p class="text-xs font-bold text-brand-electric uppercase tracking-widest mt-1">Activación del Sistema</p>
        </div>

        <div class="text-left space-y-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600">Pega tu código de licencia:</label>
            <textarea id="tokenInput" placeholder="Pega el código aquí..." class="w-full h-28 p-3.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-700 outline-none focus:ring-2 focus:ring-brand-electric shadow-sm resize-none"></textarea>
        </div>

        <!-- MENSAJE DE BIENVENIDA -->
        <div class="bg-brand-50 border border-brand-electric/20 rounded-2xl p-4 text-center">
            <p class="text-xs font-bold text-slate-700 leading-relaxed">
                ¡Para comenzar a disfrutar de todo el contenido de <strong class="text-brand-electric uppercase">YOU CONTROL VOLEY</strong>, instala la aplicación en tu dispositivo!
            </p>
        </div>

        <!-- ÚNICO BOTÓN DE INSTALACIÓN Y ACTIVACIÓN -->
        <button id="btnActivarEInstalar" class="w-full py-4 px-4 bg-brand-electric hover:bg-brand-600 text-white font-black rounded-xl shadow-electric transition text-xs uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer">
            <i class="fas fa-download text-sm"></i> Instalar Aplicación y Comenzar
        </button>

        <div id="statusMsg" class="text-xs font-bold text-slate-500"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración del Firebase Maestro (youcontrolvoley)
        const defaultConfig = {
            apiKey: "AIzaSyCbjqKJHxL5eRBJwg8mT5YK7yJUMqe2kg", 
            authDomain: "youcontrolvoley.firebaseapp.com",
            projectId: "youcontrolvoley",
            storageBucket: "youcontrolvoley.firebasestorage.app",
            messagingSenderId: "840027639026",
            appId: "1:840027639026:web:d5170253b4b16c1be0146b"
        };

        const appPrincipal = initializeApp(defaultConfig);
        const dbPrincipal = getFirestore(appPrincipal);

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        async function procesarActivacionEInstalacion() {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const statusDiv = document.getElementById('statusMsg');
            if (!rawToken) return alert("Por favor, pega el código de licencia primero.");
            
            const btn = document.getElementById('btnActivarEInstalar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Verificando licencia...`;

            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const activationId = data.clubId || data.activation_id;

                if (!activationId) {
                    throw new Error("El token no contiene un ID de club válido.");
                }

                // 1. Consultar configuración de la empresa en Firebase
                const empresaRefPrincipal = doc(dbPrincipal, "empresas_config", activationId);
                const snapEmpresaPrincipal = await getDoc(empresaRefPrincipal);

                if (snapEmpresaPrincipal.exists()) {
                    const datosEmpresaConfig = snapEmpresaPrincipal.data();
                    
                    if (datosEmpresaConfig.firebaseConfig && datosEmpresaConfig.firebaseConfig.apiKey) {
                        localStorage.setItem(`youcontrol_tenant_config_${activationId}`, JSON.stringify(datosEmpresaConfig.firebaseConfig));
                    }
                    if (datosEmpresaConfig.supabaseConfig && datosEmpresaConfig.supabaseConfig.supabaseUrl) {
                        localStorage.setItem('control_voley_supa_url', datosEmpresaConfig.supabaseConfig.supabaseUrl);
                        localStorage.setItem('control_voley_supa_key', datosEmpresaConfig.supabaseConfig.supabaseKey);
                        localStorage.setItem('control_voley_supa_bucket', datosEmpresaConfig.supabaseConfig.bucket || activationId);
                    }
                }

                if (data.supabaseUrl) {
                    localStorage.setItem('control_voley_supa_url', data.supabaseUrl);
                    localStorage.setItem('control_voley_supa_key', data.supabaseKey);
                    localStorage.setItem('control_voley_supa_bucket', data.bucket || activationId);
                }
                if (data.clubNombre) {
                    localStorage.setItem('control_voley_club_nombre', data.clubNombre);
                }

                // 2. Validar licencia y límite de dispositivos
                const licenciaRef = doc(dbPrincipal, "licencias", activationId);
                const snapLicencia = await getDoc(licenciaRef);

                let equiposLicencia = [];
                let limiteLicencia = data.limite || data.l || 3;
                if (limiteLicencia === "Ilimitado") limiteLicencia = 999;
                else limiteLicencia = parseInt(limiteLicencia) || 3;

                if (snapLicencia.exists()) {
                    const dbData = snapLicencia.data();
                    equiposLicencia = Array.isArray(dbData.equipos) ? dbData.equipos : [];
                    let limiteDb = dbData.limite;
                    if (limiteDb === "Ilimitado") limiteLicencia = 999;
                    else if (limiteDb) limiteLicencia = parseInt(limiteDb) || limiteLicencia;

                    if (!equiposLicencia.includes(hwID) && equiposLicencia.length >= limiteLicencia) {
                        alert("Error: Se ha alcanzado el límite de dispositivos permitidos para esta licencia.");
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fas fa-download text-sm"></i> Instalar Aplicación y Comenzar`;
                        return;
                    }

                    if (!equiposLicencia.includes(hwID)) {
                        equiposLicencia.push(hwID);
                        await updateDoc(licenciaRef, { equipos: equiposLicencia });
                    }
                } else {
                    equiposLicencia = [hwID];
                    await setDoc(licenciaRef, { 
                        cliente: data.clubNombre || data.n || "", 
                        limite: limiteLicencia, 
                        equipos: equiposLicencia, 
                        fecha_registro: new Date().toISOString() 
                    });
                }

                // 3. Actualizar o crear registro en empresas_config principal
                if (snapEmpresaPrincipal.exists()) {
                    const dbEmpresa = snapEmpresaPrincipal.data();
                    const equiposEmpresa = Array.isArray(dbEmpresa.equipos) ? dbEmpresa.equipos : [];
                    if (!equiposEmpresa.includes(hwID)) {
                        await updateDoc(empresaRefPrincipal, { 
                            equipos: [...equiposEmpresa, hwID],
                            licencia_token: rawToken
                        });
                    }
                } else {
                    await setDoc(empresaRefPrincipal, { 
                        nombre: data.clubNombre || data.n || "",
                        email: data.email || "",
                        limite_dispositivos: limiteLicencia, 
                        equipos: [hwID], 
                        licencia_token: rawToken,
                        timestamp: new Date().toISOString() 
                    });
                }

                // 4. Guardar sesión local
                localStorage.setItem('youcontrol_empresa_id', activationId);
                localStorage.setItem('licencia_validada', 'true');

                statusDiv.className = "text-xs font-bold text-emerald-600";
                statusDiv.innerText = "¡Licencia válida! Iniciando instalación...";

                // DISPARAR INSTALACIÓN PWA
                if (window.deferredPrompt) {
                    window.deferredPrompt.prompt();
                    const userChoice = await window.deferredPrompt.userChoice;
                    window.deferredPrompt = null;

                    if (userChoice.outcome === 'accepted') {
                        window.location.replace('index_menu.html');
                    } else {
                        alert("Es necesario instalar la aplicación para ingresar.");
                        btn.disabled = false;
                        btn.innerHTML = `<i class="fas fa-download text-sm"></i> Instalar Aplicación y Comenzar`;
                        statusDiv.innerText = "";
                    }
                } else {
                    // Si ya está en modo app o instalada
                    window.location.replace('index_menu.html');
                }
                
            } catch (e) {
                console.error("Error al procesar activación:", e);
                alert("Código de licencia inválido o error en la conexión: " + e.message);
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-download text-sm"></i> Instalar Aplicación y Comenzar`;
                statusDiv.innerText = "";
            }
        }

        document.getElementById('btnActivarEInstalar').addEventListener('click', procesarActivacionEInstalacion);
    </script>
</body>
</html>
