<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Panel de Usuario y Licencias</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f6ff',
                100: '#e0edff',
                500: '#0066ff',
                600: '#0052cc',
                700: '#003db3',
                electric: '#0055FF',
                cyan: '#00D2FF',
                dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)',
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
        }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        #lista-resultados-busqueda {
            position: absolute; top: 100%; left: 0; right: 148px;
            background: white; border: 1px solid #E2E8F0;
            border-radius: 0 0 12px 12px; max-height: 220px; overflow-y: auto;
            z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none;
        }
        .item-res-busqueda { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #F1F5F9; font-size: 0.8rem; }
        .item-res-busqueda:hover { background: #f0f6ff; color: #0055FF; }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen flex flex-col justify-between text-slate-800 antialiased p-4 sm:p-6" oncontextmenu="return false">

    <div class="max-w-2xl mx-auto w-full my-auto py-6">
        
        <!-- ENCABEZADO -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-electric to-brand-cyan flex items-center justify-center text-white shadow-electric mx-auto mb-3">
                <i class="fas fa-shield-alt text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Panel de Gestión Maestro</h1>
            <p class="text-xs font-bold text-brand-electric uppercase tracking-widest mt-1">Administración de Clubes y Licencias Supabase</p>
        </div>

        <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-glass border border-slate-200/80 space-y-6">
            
            <!-- BUSCADOR -->
            <div class="relative">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Buscar Club Existente</label>
                <div class="flex gap-2">
                    <input type="text" id="busquedaInput" placeholder="Ej: RCDEP-CIAR o Nombre..." autocomplete="off" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric focus:border-brand-electric outline-none shadow-sm">
                    <button class="px-5 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-sm flex items-center gap-2">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
                <div id="lista-resultados-busqueda"></div>
            </div>

            <div class="text-center">
                <button id="btnNuevo" class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold rounded-xl text-xs uppercase tracking-wider transition">
                    <i class="fas fa-plus-circle mr-1"></i> Registrar Nuevo Club / Licencia
                </button>
            </div>

            <hr class="border-slate-200">

            <!-- CONFIGURACIÓN DEL CLUB -->
            <div>
                <h3 class="text-xs font-black uppercase tracking-wider text-brand-electric mb-4 flex items-center gap-2">
                    <i class="fas fa-volleyball-ball"></i> Configuración del Club
                </h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">ID del Club / Activación</label>
                        <input type="text" id="empresaID" placeholder="Ej: RCDEP-CIAR" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm uppercase">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre del Club</label>
                            <input type="text" id="nombreEmpresa" placeholder="Ej: Club CIAR" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">RIF / Identificación Fiscal</label>
                            <input type="text" id="rif" placeholder="Ej: J-12345678-9" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Autorizado (Admin)</label>
                            <input type="email" id="email" placeholder="admin@club.com" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Límite de Dispositivos</label>
                            <select id="limite" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                                <option value="1">1 Dispositivo</option>
                                <option value="2">2 Dispositivos</option>
                                <option value="3" selected>3 Dispositivos</option>
                                <option value="5">5 Dispositivos</option>
                                <option value="10">10 Dispositivos</option>
                                <option value="Ilimitado">Ilimitado</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PROYECTO SUPABASE DEL CLUB -->
            <div class="p-5 bg-brand-50/60 border border-brand-electric/20 rounded-2xl space-y-4">
                <h3 class="text-xs font-black uppercase tracking-wider text-brand-electric flex items-center gap-2">
                    <i class="fas fa-database"></i> Proyecto Supabase del Club (Base de Datos + Fotos)
                </h3>
                <p class="text-[11px] text-slate-500 font-semibold leading-relaxed">Pega aquí la URL y la Anon Key del proyecto Supabase dedicado a este club.</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Supabase Project URL</label>
                        <input type="text" id="supaUrl" placeholder="https://xxx.supabase.co" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Supabase Bucket</label>
                        <input type="text" id="supaBucket" value="control-voley" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Supabase Anon Key (Llave Pública)</label>
                    <input type="text" id="supaKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5c..." class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                </div>
            </div>

            <button id="btnGuardar" class="w-full py-4 px-4 bg-brand-electric hover:bg-brand-600 text-white font-black rounded-xl shadow-electric transition text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                <i class="fas fa-key"></i> Generar Licencia y Aprovisionar Club
            </button>
            <div id="status" class="text-center font-bold text-xs text-emerald-600"></div>

            <!-- TOKEN RESULTADO -->
            <div id="resultBox" class="hidden p-4 bg-white border border-slate-200 rounded-2xl relative shadow-sm">
                <button onclick="copiarToken()" class="absolute right-4 top-4 bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider transition">Copiar</button>
                <p class="text-xs font-bold text-slate-700 mb-2"><i class="fas fa-key text-brand-electric"></i> Token de Licencia Generado</p>
                <textarea id="tokenResult" readonly class="w-full h-20 bg-slate-50 border border-slate-200 rounded-xl p-2 font-mono text-[11px] text-slate-600 resize-none outline-none"></textarea>
            </div>

        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://zgkbjpesmgqiprvfowju.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VC9fuoRhlPpJ-8ZrERYfiA_TT_FyciK";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        let cacheClubes = [];

        async function cargarCache() {
            try {
                const { data, error } = await supabase.from('licencias_master').select('*');
                if (!error && data) cacheClubes = data;
            } catch (e) {
                console.error("Error cargando licencias:", e);
            }
        }
        cargarCache();

        const inputBusqueda = document.getElementById('busquedaInput');
        const listaResultados = document.getElementById('lista-resultados-busqueda');

        inputBusqueda.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term.length === 0) { listaResultados.style.display = 'none'; return; }

            const filtrados = cacheClubes.filter(emp => 
                (emp.nombre && emp.nombre.toLowerCase().includes(term)) ||
                (emp.club_id && emp.club_id.toLowerCase().includes(term)) ||
                (emp.rif && emp.rif.toLowerCase().includes(term))
            );

            if (filtrados.length > 0) {
                listaResultados.style.display = 'block';
                listaResultados.innerHTML = filtrados.map(emp => `
                    <div class="item-res-busqueda" onclick="window.seleccionarClub('${emp.club_id}')">
                        <strong>${emp.nombre}</strong><br>
                        <small class="text-slate-500">ID: ${emp.club_id} | RIF: ${emp.rif || 'N/A'}</small>
                    </div>
                `).join('');
            } else {
                listaResultados.style.display = 'block';
                listaResultados.innerHTML = `<div class="p-3 text-slate-400 text-xs">No se encontraron clubes.</div>`;
            }
        });

        window.seleccionarClub = (clubId) => {
            listaResultados.style.display = 'none';
            const club = cacheClubes.find(c => c.club_id === clubId);
            if (!club) return;

            document.getElementById('empresaID').value = club.club_id;
            document.getElementById('nombreEmpresa').value = club.nombre;
            document.getElementById('rif').value = club.rif || "";
            document.getElementById('email').value = club.email || "";
            document.getElementById('limite').value = club.limite_dispositivos || "3";
            document.getElementById('supaUrl').value = club.supabase_url || "";
            document.getElementById('supaKey').value = club.supabase_key || "";
            document.getElementById('supaBucket').value = club.bucket_name || "control-voley";

            if (club.token_licencia) {
                document.getElementById('tokenResult').value = club.token_licencia;
                document.getElementById('resultBox').classList.remove('hidden');
            }
            document.getElementById('status').innerText = "✅ Club cargado correctamente.";
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) listaResultados.style.display = 'none';
        });

        document.getElementById('btnNuevo').addEventListener('click', () => {
            document.getElementById('empresaID').value = "";
            document.getElementById('nombreEmpresa').value = "";
            document.getElementById('rif').value = "";
            document.getElementById('email').value = "";
            document.getElementById('limite').value = "3";
            document.getElementById('supaUrl').value = "";
            document.getElementById('supaKey').value = "";
            document.getElementById('supaBucket').value = "control-voley";
            document.getElementById('resultBox').classList.add('hidden');
            inputBusqueda.value = "";
            document.getElementById('status').innerText = "✨ Ingrese los datos para el nuevo club.";
        });

        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const clubId = document.getElementById('empresaID').value.trim().toUpperCase();
            const nombre = document.getElementById('nombreEmpresa').value.trim();
            const rif = document.getElementById('rif').value.trim();
            const email = document.getElementById('email').value.trim();
            const limite = document.getElementById('limite').value;
            const supaUrl = document.getElementById('supaUrl').value.trim();
            const supaKey = document.getElementById('supaKey').value.trim();
            const supaBucket = document.getElementById('supaBucket').value.trim();

            if (!clubId || !nombre || !supaUrl || !supaKey) {
                return alert("Completa el ID del Club, Nombre y las credenciales de Supabase.");
            }

            const tokenData = {
                clubId: clubId,
                clubNombre: nombre,
                limite: limite,
                supabaseUrl: supaUrl,
                supabaseKey: supaKey,
                bucket: supaBucket || "control-voley"
            };
            const tokenBase64 = btoa(JSON.stringify(tokenData));

            try {
                const { error } = await supabase
                    .from('licencias_master')
                    .upsert([{
                        club_id: clubId,
                        nombre: nombre,
                        rif: rif,
                        email: email,
                        limite_dispositivos: limite,
                        supabase_url: supaUrl,
                        supabase_key: supaKey,
                        bucket_name: supaBucket || "control-voley",
                        token_licencia: tokenBase64,
                        updated_at: new Date().toISOString()
                    }], { onConflict: 'club_id' });

                if (error) throw error;

                cargarCache();
                document.getElementById('tokenResult').value = tokenBase64;
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('status').innerText = "🚀 ¡Club registrado y guardado en Supabase con éxito!";
            } catch (err) {
                alert("Error al guardar en Supabase: " + err.message);
            }
        });

        window.copiarToken = function() {
            const copyText = document.getElementById("tokenResult");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Token de licencia copiado al portapapeles!");
        };
    </script>
</body>
</html>
