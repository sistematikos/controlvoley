<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Panel de Gestión Maestro (Supabase Licencias)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f0f6ff', 100: '#e0edff', 500: '#0066ff', 600: '#0052cc', 700: '#003db3',
                electric: '#0055FF', cyan: '#00D2FF', dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)'
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.8); }
        #lista-resultados-busqueda {
            position: absolute; top: 100%; left: 0; right: 148px;
            background: white; border: 1px solid #E2E8F0;
            border-radius: 0 0 12px 12px; max-height: 220px; overflow-y: auto;
            z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none;
        }
        .item-res-busqueda { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #F1F5F9; font-size: 0.8rem; }
        .item-res-busqueda:hover { background: #f0f6ff; color: #0055FF; }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen flex flex-col justify-between text-slate-800 antialiased p-4 sm:p-6" oncontextmenu="return false">

    <div class="max-w-2xl mx-auto w-full my-auto py-6">
        
        <!-- ENCABEZADO -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-electric to-brand-cyan flex items-center justify-center text-white shadow-electric mx-auto mb-3">
                <i class="fas fa-key text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-slate-900 uppercase tracking-tight">Panel Maestro de Licencias</h1>
            <p class="text-xs font-bold text-brand-electric uppercase tracking-widest mt-1">Supabase Maestro (licencias_clubes)</p>
        </div>

        <div class="glass-card p-6 sm:p-8 rounded-3xl shadow-glass border border-slate-200/80 space-y-6">
            
            <!-- BUSCADOR -->
            <div class="relative">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Buscar Club Existente</label>
                <div class="flex gap-2">
                    <input type="text" id="busquedaInput" placeholder="Ej: YCDEP-CIAR o Nombre..." autocomplete="off" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                    <button id="btnBuscarManual" class="px-5 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs uppercase tracking-wider transition shadow-sm flex items-center gap-2 cursor-pointer">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
                <div id="lista-resultados-busqueda"></div>
            </div>

            <div class="text-center">
                <button id="btnNuevo" class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 font-bold rounded-xl text-xs uppercase tracking-wider transition cursor-pointer">
                    <i class="fas fa-plus-circle mr-1"></i> Registrar Nuevo Club / Licencia
                </button>
            </div>

            <hr class="border-slate-200">

            <!-- CONFIGURACIÓN DEL CLUB -->
            <div>
                <h3 class="text-xs font-black uppercase tracking-wider text-brand-electric mb-4 flex items-center gap-2">
                    <i class="fas fa-volleyball-ball"></i> Configuración General del Club
                </h3>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">ID del Club / Activación (Único)</label>
                        <input type="text" id="empresaID" placeholder="Ej: YCDEP-CIAR" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm uppercase">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Nombre del Club</label>
                            <input type="text" id="nombreEmpresa" placeholder="Ej: Club CIAR" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Ciudad</label>
                            <input type="text" id="ciudad" placeholder="Ej: Barquisimeto" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Correo Autorizado (Admin)</label>
                            <input type="email" id="email" placeholder="admin@club.com" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Teléfono de Contacto</label>
                            <input type="text" id="telefono" placeholder="Ej: 0412-1234567" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Límite de Dispositivos</label>
                        <select id="limite" class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                            <option value="1">1 Dispositivo</option>
                            <option value="2">2 Dispositivos</option>
                            <option value="3" selected>3 Dispositivos</option>
                            <option value="5">5 Dispositivos</option>
                            <option value="10">10 Dispositivos</option>
                            <option value="Ilimitado">Ilimitado</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SUPABASE CONFIGURACIÓN Y STORAGE -->
            <div class="p-5 bg-slate-50 border border-slate-200 rounded-2xl space-y-4">
                <h3 class="text-xs font-black uppercase tracking-wider text-slate-700 flex items-center gap-2">
                    <i class="fas fa-database text-brand-electric"></i> Supabase del Club (Datos y Fotos)
                </h3>
                <p class="text-[11px] text-slate-500 font-semibold leading-relaxed">Pega aquí los datos de Supabase del proyecto independiente del club.</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Project URL (General / API)</label>
                        <input type="text" id="supaUrl" placeholder="https://zgkbjpesmgqiprvfowju.supabase.co" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Bucket Name (Storage)</label>
                        <input type="text" id="supaBucket" placeholder="Ej: YCDEP-CIAR" value="YCDEP-CIAR" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Publishable key (API Keys)</label>
                    <input type="text" id="supaKey" placeholder="sb_publishable_..." class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs font-mono text-slate-800 focus:ring-2 focus:ring-brand-electric outline-none shadow-sm">
                </div>
            </div>

            <button id="btnGuardar" class="w-full py-4 px-4 bg-brand-electric hover:bg-brand-600 text-white font-black rounded-xl shadow-electric transition text-sm uppercase tracking-wider flex items-center justify-center gap-2 cursor-pointer">
                <i class="fas fa-save"></i> Guardar en Supabase y Generar Licencia
            </button>
            <div id="status" class="text-center font-bold text-xs text-emerald-600"></div>

            <!-- TOKEN RESULTADO -->
            <div id="resultBox" class="hidden p-4 bg-white border border-slate-200 rounded-2xl relative shadow-sm">
                <button onclick="copiarToken()" class="absolute right-4 top-4 bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider transition cursor-pointer">Copiar</button>
                <p class="text-xs font-bold text-slate-700 mb-2"><i class="fas fa-key text-brand-electric"></i> Token de Licencia Generado</p>
                <textarea id="tokenResult" readonly class="w-full h-20 bg-slate-50 border border-slate-200 rounded-xl p-2 font-mono text-[11px] text-slate-600 resize-none outline-none"></textarea>
            </div>

        </div>
    </div>

    <!-- MÓDULO SUPABASE MAESTRO -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        // Credenciales de tu Supabase Maestro (licencias_clubes) con la llave real integrada
        const MASTER_SUPA_URL = "https://ajdimbptzoeqzrrioywt.supabase.co";
        const MASTER_SUPA_KEY = "sb_publishable_aVydbrj88elb7XVq1yopFw_2U4MHgHv";

        const supabaseMaster = createClient(MASTER_SUPA_URL, MASTER_SUPA_KEY);
        let cacheEmpresas = [];

        async function cargarCacheEmpresas() {
            try {
                const { data, error } = await supabaseMaster.from('licencias').select('*');
                if (error) throw error;
                cacheEmpresas = data || [];
            } catch (e) {
                console.error("Error al precargar empresas desde Supabase Maestro:", e);
            }
        }
        cargarCacheEmpresas();

        const inputBusqueda = document.getElementById('busquedaInput');
        const listaResultados = document.getElementById('lista-resultados-busqueda');

        inputBusqueda.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            if (term.length === 0) { listaResultados.style.display = 'none'; return; }

            const filtrados = cacheEmpresas.filter(emp => 
                (emp.nombre && emp.nombre.toLowerCase().includes(term)) ||
                (emp.id && emp.id.toLowerCase().includes(term)) ||
                (emp.ciudad && emp.ciudad.toLowerCase().includes(term))
            );

            if (filtrados.length > 0) {
                listaResultados.style.display = 'block';
                listaResultados.innerHTML = filtrados.map(emp => `
                    <div class="item-res-busqueda" onclick="window.seleccionarEmpresaBusqueda('${emp.id}')">
                        <strong>${emp.nombre || 'Sin Nombre'}</strong><br>
                        <small class="text-slate-500">ID: ${emp.id} | Ciudad: ${emp.ciudad || 'N/A'}</small>
                    </div>
                `).join('');
            } else {
                listaResultados.style.display = 'block';
                listaResultados.innerHTML = `<div class="p-3 text-slate-400 text-xs">No se encontraron empresas.</div>`;
            }
        });

        window.seleccionarEmpresaBusqueda = async (id) => {
            listaResultados.style.display = 'none';
            inputBusqueda.value = id;

            const emp = cacheEmpresas.find(x => x.id === id);
            if (!emp) return alert("Empresa no encontrada en caché.");

            document.getElementById('empresaID').value = emp.id;
            document.getElementById('nombreEmpresa').value = emp.nombre || "";
            document.getElementById('ciudad').value = emp.ciudad || "";
            document.getElementById('email').value = emp.email || "";
            document.getElementById('telefono').value = emp.telefono || "";
            document.getElementById('limite').value = emp.limite_dispositivos || "3";
            document.getElementById('supaUrl').value = emp.supabase_url || "";
            document.getElementById('supaKey').value = emp.supabase_key || "";
            document.getElementById('supaBucket').value = emp.bucket || id;

            if (emp.licencia_token) {
                document.getElementById('tokenResult').value = emp.licencia_token;
                document.getElementById('resultBox').classList.remove('hidden');
            }
            document.getElementById('status').innerText = "✅ Datos del club cargados desde la tabla licencias.";
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.relative')) listaResultados.style.display = 'none';
        });

        document.getElementById('btnNuevo').addEventListener('click', () => {
            document.getElementById('empresaID').value = "";
            document.getElementById('nombreEmpresa').value = "";
            document.getElementById('ciudad').value = "";
            document.getElementById('email').value = "";
            document.getElementById('telefono').value = "";
            document.getElementById('limite').value = "3";
            document.getElementById('supaUrl').value = "";
            document.getElementById('supaKey').value = "";
            document.getElementById('supaBucket').value = "YCDEP-CIAR";
            document.getElementById('resultBox').classList.add('hidden');
            inputBusqueda.value = "";
            document.getElementById('status').innerText = "✨ Ingrese los datos para el nuevo club.";
        });

        document.getElementById('btnGuardar').addEventListener('click', async () => {
            const id = document.getElementById('empresaID').value.trim().toUpperCase();
            const nombre = document.getElementById('nombreEmpresa').value.trim();
            const ciudad = document.getElementById('ciudad').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefono = document.getElementById('telefono').value.trim();
            const limite = document.getElementById('limite').value;

            const supaUrl = document.getElementById('supaUrl').value.trim();
            const supaKey = document.getElementById('supaKey').value.trim();
            const supaBucket = document.getElementById('supaBucket').value.trim();

            if (!id || !nombre || !supaUrl || !supaKey) {
                return alert("El ID del Club, el Nombre y las credenciales de Supabase son obligatorios.");
            }

            // Generar Token unificado con Supabase
            const tokenData = {
                clubId: id,
                clubNombre: nombre,
                limite: limite,
                supabaseUrl: supaUrl,
                supabaseKey: supaKey,
                bucket: supaBucket || id
            };
            const tokenBase64 = btoa(JSON.stringify(tokenData));

            const datosGuardar = {
                id: id,
                nombre: nombre,
                ciudad: ciudad,
                email: email,
                telefono: telefono,
                limite_dispositivos: limite,
                supabase_url: supaUrl,
                supabase_key: supaKey,
                bucket: supaBucket || id,
                licencia_token: tokenBase64,
                updated_at: new Date().toISOString()
            };

            const btn = document.getElementById('btnGuardar');
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Guardando en Supabase...`;

            try {
                const { error } = await supabaseMaster.from('licencias').upsert(datosGuardar);
                if (error) throw error;

                cargarCacheEmpresas();
                document.getElementById('tokenResult').value = tokenBase64;
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('status').innerText = "🚀 ¡Guardado en la tabla licencias con éxito!";
            } catch (err) {
                alert("Error al guardar en Supabase: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-save"></i> Guardar en Supabase y Generar Licencia`;
            }
        });

        window.copiarToken = function() {
            const copyText = document.getElementById("tokenResult");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("¡Token de licencia copiado al portapapeles!");
        };
    </script>
</body>
</html>
