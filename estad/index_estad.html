<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Scouting & Stats PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f0f6ff', 100: '#e0edff', 500: '#0066ff', 600: '#0052cc', 700: '#003db3',
                electric: '#0055FF', cyan: '#00D2FF', dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)'
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; user-select: none; }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .banner-glow { position: relative; }
        .banner-glow::after {
            content: '';
            position: absolute;
            bottom: -15px; left: 5%; width: 90%; height: 30px;
            background: linear-gradient(90deg, #0055FF, #00D2FF);
            filter: blur(20px); opacity: 0.35; z-index: -1; border-radius: 50%;
        }
        input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen text-slate-800 antialiased p-3 sm:p-6" oncontextmenu="return false">

    <main class="max-w-5xl mx-auto space-y-6">
        
        <!-- BARRA SUPERIOR Y MENÚ -->
        <div class="flex items-center justify-between">
            <a href="index_menu.html" class="px-4 py-2 bg-white/80 hover:bg-white text-slate-700 rounded-xl font-bold text-xs shadow-sm flex items-center gap-2 transition border border-slate-200">
                <i class="fas fa-arrow-left"></i> Volver al Menú
            </a>
            <span id="userEmail" class="text-xs font-bold text-slate-500">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span> Cargando club...
            </span>
        </div>

        <!-- BANNER SUPERIOR CON GLOW -->
        <div class="banner-glow mb-2">
            <div class="rounded-3xl overflow-hidden shadow-2xl relative border border-white/60 bg-slate-950">
                <img src="img/banner.png" alt="Control Voley Banner" class="w-full h-36 sm:h-44 object-cover opacity-80" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1600&auto=format&fit=crop'">
                <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-transparent flex flex-col justify-center px-6 sm:px-10">
                    <span class="text-sky-400 text-xs font-extrabold uppercase tracking-widest flex items-center gap-2 mb-1">
                        <i class="fas fa-chart-line"></i> Scouting en Vivo
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-black text-white leading-tight">
                        Control Voley <span class="text-brand-cyan">Stats</span>
                    </h1>
                    <p class="text-slate-300 text-xs sm:text-sm mt-1 font-medium">
                        Configuración de partido, roster activo y registro estadístico.
                    </p>
                </div>
            </div>
        </div>

        <!-- 1. CONFIGURACIÓN DEL PARTIDO -->
        <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 flex items-center gap-2">
                    <i class="fas fa-trophy text-amber-500"></i> Datos del Encuentro
                </h2>
                <span id="fechaJuegoDisplay" class="text-xs font-bold text-brand-electric bg-brand-50 px-3 py-1 rounded-lg border border-brand-electric/20"></span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Equipo Local / Club</label>
                    <input type="text" id="equipoLocal" placeholder="Ej: Lara" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-slate-800 outline-none shadow-sm bg-white">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-600 mb-1">Equipo Visitante / Rival</label>
                    <input type="text" id="equipoRival" placeholder="Ej: Carabobo" class="w-full border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-slate-800 outline-none shadow-sm bg-white">
                </div>
            </div>
        </div>

        <!-- 2. GESTIÓN DEL ROSTER (CONVOCATORIA) -->
        <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 space-y-4">
            <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 border-b border-slate-200 pb-3 flex items-center gap-2">
                <i class="fas fa-users text-brand-electric"></i> Conformar Roster del Partido
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Agregar desde Nómina -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                    <label class="block text-xs font-black uppercase text-slate-700">Añadir Atleta de Nómina</label>
                    <div class="flex gap-2">
                        <select id="selectNomina" class="flex-1 border border-slate-200 p-2 rounded-xl text-xs font-bold text-slate-800 outline-none bg-white">
                            <option value="">Cargando atletas...</option>
                        </select>
                        <button type="button" id="btnAgregarNomina" class="bg-brand-electric hover:bg-brand-600 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Agregar Manual / Invitado -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                    <label class="block text-xs font-black uppercase text-slate-700">Añadir Atleta Manual / Invitado</label>
                    <div class="flex gap-2">
                        <input type="number" id="manualNum" placeholder="Nro" class="w-16 border border-slate-200 p-2 rounded-xl text-xs font-bold text-slate-800 outline-none bg-white">
                        <input type="text" id="manualNom" placeholder="Nombre / Alias" class="flex-1 border border-slate-200 p-2 rounded-xl text-xs font-bold text-slate-800 outline-none bg-white">
                        <button type="button" id="btnAgregarManual" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-sm">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chips de Atletas Convocados en el Roster -->
            <div>
                <label class="block text-[11px] font-bold uppercase text-slate-500 mb-2">Atletas Convocados en Roster (<span id="countRoster">0</span>):</label>
                <div id="rosterChips" class="flex flex-wrap gap-2 min-h-[40px] p-3 bg-white rounded-2xl border border-slate-200">
                    <span class="text-xs text-slate-400 italic">No hay atletas añadidos al roster aún.</span>
                </div>
            </div>
        </div>

        <!-- 3. REGISTRO DE ACCIONES EN VIVO -->
        <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 space-y-4">
            <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 border-b border-slate-200 pb-3 flex items-center gap-2">
                <i class="fas fa-bolt text-brand-electric"></i> Registrar Acción
            </h2>

            <form id="f" class="space-y-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <select id="ps" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm" required>
                        <option value="">Seleccione Atleta del Roster...</option>
                    </select>
                    <select id="as" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm" required>
                        <option value="">Seleccione Acción...</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-brand-electric hover:bg-brand-600 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-wider shadow-electric transition cursor-pointer">
                    <i class="fas fa-plus-circle mr-1"></i> Registrar Jugada
                </button>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button type="button" id="rs" class="bg-amber-600 hover:bg-amber-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm">Limpiar Set Actual</button>
                    <button type="button" id="ra" class="bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm">
                        <i class="fas fa-trash-can mr-1"></i> Eliminar Juego / Blanquear
                    </button>
                </div>
            </form>
        </div>

        <!-- 4. RESUMEN Y GRÁFICAS -->
        <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 space-y-4">
            <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 border-b border-slate-200 pb-3 flex items-center gap-2">
                <i class="fas fa-list-check text-brand-electric"></i> Rendimiento del Partido
            </h2>
            <div id="st" class="space-y-2"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 h-72">
                <canvas id="c1"></canvas>
            </div>
            <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 h-72">
                <canvas id="c2"></canvas>
                <div id="sum" class="text-center mt-2 text-xs font-bold text-slate-600"></div>
            </div>
        </div>

    </main>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const _ = id => document.getElementById(id);
        const empresaID = (localStorage.getItem('youcontrol_empresa_id') || '').trim();
        const clubNombre = localStorage.getItem('control_voley_club_nombre') || empresaID || 'Club Voley';

        let supaUrl = localStorage.getItem('control_voley_supa_url');
        let supaKey = localStorage.getItem('control_voley_supa_key');

        if (supaUrl) supaUrl = supaUrl.replace(/[\[\]]/g, '').trim();
        if (supaKey) supaKey = supaKey.replace(/[\[\]]/g, '').trim();

        if (!empresaID || !supaUrl || !supaKey) {
            alert("Sesión no autorizada o credenciales faltantes.");
            window.location.href = 'index.html';
        }

        const userEmailEl = _('userEmail');
        if (userEmailEl) {
            userEmailEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Club: ${clubNombre}`;
        }

        const supabase = createClient(supaUrl, supaKey);

        let L_Nomina = []; // Atletas cargados de Supabase
        let Roster = [];  // Atletas convocados para el partido (Nomina + Manuales)
        let S = [];       // Acciones del Set Actual
        let M = [];       // Acciones Totales del Partido
        let b = null, a = null;

        const N = {
            'Servicio Bueno S#': 1, 'Ataque Bueno A#': 1, 'Bloqueo Bueno B#': 1, 'Coloque Bueno C#': 1,
            'Servicio Malo S=': -1, 'Ataque Malo A=': -1, 'Bloqueo Malo B=': -1, 'Recepción Mala R=': -1, 
            'Coloque Malo C=': -1, 'Defensa Mala D=': -1
        };
        const O = { S: 'Servicio', A: 'Ataque', B: 'Bloqueo', R: 'Recepción', C: 'Coloque', D: 'Defensa' };
        const P = { b: '#0055FF', r: '#dc2626', o: '#f97316', g: '#10b981' };
        const K = { scales: { y: { ticks: { stepSize: 1 } } }, responsive: true, maintainAspectRatio: false };

        // 1. Inicialización de Datos
        async function init() {
            // Fecha Automática
            const hoy = new Date();
            const fechaStr = hoy.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            _('fechaJuegoDisplay').textContent = fechaStr;

            // Cargar datos locales guardados
            _('equipoLocal').value = localStorage.getItem('vLocal_' + empresaID) || clubNombre;
            _('equipoRival').value = localStorage.getItem('vRival_' + empresaID) || 'Rival';

            _('equipoLocal').oninput = e => localStorage.setItem('vLocal_' + empresaID, e.target.value);
            _('equipoRival').oninput = e => localStorage.setItem('vRival_' + empresaID, e.target.value);

            // Cargar Nómina desde Supabase
            try {
                const { data: atletas } = await supabase.from('atletas').select('*').order('nroCamiseta', { ascending: true });
                L_Nomina = atletas || [];
                poblaryNominaSelect();
            } catch (err) {
                console.error("Error al cargar atletas de Supabase:", err);
            }

            Roster = JSON.parse(localStorage.getItem('vRoster_' + empresaID) || '[]');
            S = JSON.parse(localStorage.getItem('vS_' + empresaID) || '[]');
            M = JSON.parse(localStorage.getItem('vM_' + empresaID) || '[]');

            renderRoster();
            U();
        }

        function poblaryNominaSelect() {
            const select = _('selectNomina');
            select.innerHTML = '<option value="">Seleccione de Nómina...</option>';
            L_Nomina.forEach(p => {
                let o = document.createElement('option');
                o.value = p.cedulaIdentidad || p.id;
                o.textContent = `#${p.nroCamiseta || '0'} ${p.nombre} ${p.apellido || ''}`;
                select.appendChild(o);
            });
        }

        // Llenar selector de acciones
        const as = _('as');
        Object.keys(N).forEach(k => {
            let o = document.createElement('option');
            o.value = k;
            o.textContent = k;
            as.appendChild(o);
        });

        // 2. Agregar Atleta a Roster desde Nómina
        _('btnAgregarNomina').onclick = () => {
            const idKey = _('selectNomina').value;
            if (!idKey) return;
            const atleta = L_Nomina.find(x => (x.cedulaIdentidad || x.id) == idKey);
            if (atleta && !Roster.some(x => x.key == idKey)) {
                Roster.push({
                    key: idKey,
                    num: atleta.nroCamiseta || '0',
                    name: `${atleta.nombre} ${atleta.apellido || ''}`.trim(),
                    esManual: false
                });
                guardarEstado();
                renderRoster();
                U();
            }
        };

        // 3. Agregar Atleta a Roster Manualmente
        _('btnAgregarManual').onclick = () => {
            const num = _('manualNum').value.trim();
            const nom = _('manualNom').value.trim();
            if (!num || !nom) { alert("Ingresa número y nombre."); return; }

            const key = 'MANUAL_' + num + '_' + Date.now();
            Roster.push({ key: key, num: num, name: nom, esManual: true });

            _('manualNum').value = '';
            _('manualNom').value = '';

            guardarEstado();
            renderRoster();
            U();
        };

        // Renderizar Lista/Chips de Roster Convocado
        function renderRoster() {
            const container = _('rosterChips');
            const ps = _('ps');
            _('countRoster').textContent = Roster.length;

            ps.innerHTML = '<option value="">Seleccione Atleta del Roster...</option>';

            if (!Roster.length) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic">No hay atletas añadidos al roster aún.</span>';
                return;
            }

            container.innerHTML = '';
            Roster.forEach(p => {
                // Chip en interfaz
                const chip = document.createElement('div');
                chip.className = 'inline-flex items-center gap-2 bg-brand-50 border border-brand-electric/20 text-brand-electric px-3 py-1 rounded-xl text-xs font-bold';
                chip.innerHTML = `<span>#${p.num} ${p.name}</span> <button type="button" class="text-rose-500 hover:text-rose-700 font-bold ml-1" onclick="quitarDeRoster('${p.key}')">&times;</button>`;
                container.appendChild(chip);

                // Opción en el select de jugadas
                let o = document.createElement('option');
                o.value = p.key;
                o.textContent = `#${p.num} ${p.name}`;
                ps.appendChild(o);
            });
        }

        window.quitarDeRoster = (key) => {
            Roster = Roster.filter(x => x.key !== key);
            guardarEstado();
            renderRoster();
            U();
        };

        function guardarEstado() {
            localStorage.setItem('vRoster_' + empresaID, JSON.stringify(Roster));
            localStorage.setItem('vS_' + empresaID, JSON.stringify(S));
            localStorage.setItem('vM_' + empresaID, JSON.stringify(M));
        }

        // 4. Registrar Jugada
        _('f').onsubmit = e => {
            e.preventDefault();
            const playerKey = _('ps').value;
            const accion = _('as').value;

            if (!playerKey || !accion) return;

            let l = { playerKey: playerKey, action: accion };
            M.push(l);
            S.push(l);
            guardarEstado();
            U();
        };

        // 5. Renderizar Estadísticas y Gráficas
        function U() {
            const s = _('st');
            s.innerHTML = '';

            let d = {};
            Roster.forEach(p => {
                d[p.key] = { p: 0, n: 0, a: {}, name: p.name, num: p.num };
            });

            S.forEach(l => {
                let k = d[l.playerKey];
                if (k) {
                    let v = N[l.action], t = l.action.charAt(l.action.length - 2);
                    v > 0 ? k.p++ : k.n++;
                    if (!k.a[t]) k.a[t] = { p: 0, n: 0 };
                    v > 0 ? k.a[t].p++ : k.a[t].n++;
                }
            });

            if (!Roster.length) {
                s.innerHTML = '<p class="text-center text-slate-400 text-xs py-3">Agrega atletas al Roster para iniciar el registro.</p>';
            } else {
                Object.values(d).forEach(k => {
                    let dt = '';
                    Object.keys(k.a).forEach(x => dt += `<span class="mr-2 font-mono">${x}: <span class="text-emerald-600 font-bold">${k.a[x].p}</span>|<span class="text-rose-600 font-bold">${k.a[x].n}</span></span>`);
                    s.innerHTML += `
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                            <div class="flex justify-between font-black text-slate-800">
                                <span>#${k.num} ${k.name}</span>
                                <span class="px-2 py-0.5 rounded-lg ${k.p - k.n >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">Dif: ${k.p - k.n}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 mt-1">${dt || '<span class="italic text-slate-400">Sin jugadas registradas en este set</span>'}</div>
                        </div>`;
                });
            }

            // Gráficas Chart.js
            const x1 = _('c1').getContext('2d'), x2 = _('c2').getContext('2d'), l = Object.values(O);
            let v1 = { p: [0,0,0,0,0,0], n: [0,0,0,0,0,0] }, v2 = { p: [0,0,0,0,0,0], n: [0,0,0,0,0,0] }, tp = 0, tn = 0;

            const keys = Object.keys(O);
            keys.forEach((k, idx) => {
                let p = 0, n = 0, ap = 0, an = 0;
                S.forEach(z => { if (z.action.charAt(z.action.length - 2) === k) N[z.action] > 0 ? p++ : n++; });
                M.forEach(z => { 
                    if (z.action.charAt(z.action.length - 2) === k) {
                        if (N[z.action] > 0) { ap++; tp++; } else { an++; tn++; }
                    }
                });
                v1.p[idx] = p; v1.n[idx] = n;
                v2.p[idx] = ap; v2.n[idx] = an;
            });

            if (b) b.destroy();
            b = new Chart(x1, { type: 'bar', data: { labels: l, datasets: [{ label: 'Positivo (+)', data: v1.p, backgroundColor: P.b }, { label: 'Negativo (-)', data: v1.n, backgroundColor: P.o }] }, options: { ...K, plugins: { title: { display: true, text: 'SET ACTUAL' } } } });
            
            const loc = _('equipoLocal').value || 'Local';
            const riv = _('equipoRival').value || 'Rival';
            _('sum').innerHTML = `${loc} vs ${riv} — Positivos: <span class="text-emerald-600 font-bold">${tp}</span> | Negativos: <span class="text-rose-600 font-bold">${tn}</span>`;
            
            if (a) a.destroy();
            a = new Chart(x2, { type: 'bar', data: { labels: l, datasets: [{ label: 'Positivo (+)', data: v2.p, backgroundColor: P.g }, { label: 'Negativo (-)', data: v2.n, backgroundColor: P.o }] }, options: { ...K, plugins: { title: { display: true, text: 'TOTAL PARTIDO' } } } });
        }

        // Limpiar Set
        _('rs').onclick = () => {
            if (confirm('¿Desea limpiar los datos del set actual?')) { S = []; guardarEstado(); U(); }
        };

        // Eliminar Juego (Blanquear Roster e Información)
        _('ra').onclick = () => {
            if (confirm('¿Seguro que deseas ELIMINAR EL JUEGO? Esto colocará en blanco el Roster, reseteará las estadísticas a cero y limpiará la información del encuentro.')) {
                localStorage.removeItem('vRoster_' + empresaID);
                localStorage.removeItem('vS_' + empresaID);
                localStorage.removeItem('vM_' + empresaID);
                localStorage.removeItem('vLocal_' + empresaID);
                localStorage.removeItem('vRival_' + empresaID);
                Roster = []; S = []; M = [];
                _('equipoLocal').value = clubNombre;
                _('equipoRival').value = 'Carabobo';
                renderRoster();
                U();
            }
        };

        init();
    </script>
</body>
</html>
