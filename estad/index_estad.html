<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Voley | Estadísticas y Scouting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
            colors: {
              brand: {
                50: '#f0f6ff', 100: '#e0edff', 500: '#0066ff', 600: '#0052cc', 700: '#003db3',
                electric: '#0055FF', cyan: '#00D2FF', dark: '#030B1E'
              }
            },
            boxShadow: {
              'electric': '0 10px 30px -5px rgba(0, 85, 255, 0.3)',
              'glass': '0 20px 40px rgba(0, 31, 63, 0.05)'
            }
          }
        }
      }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; user-select: none; }
        .bg-sports-pattern {
            background-color: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.5) 0px, transparent 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .banner-glow { position: relative; }
        .banner-glow::after {
            content: '';
            position: absolute;
            bottom: -15px; left: 5%; width: 90%; height: 30px;
            background: linear-gradient(90deg, #0055FF, #00D2FF);
            filter: blur(20px); opacity: 0.35; z-index: -1; border-radius: 50%;
        }
        input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-sports-pattern min-h-screen text-slate-800 antialiased p-3 sm:p-6" oncontextmenu="return false">

    <main class="max-w-5xl mx-auto space-y-6">
        
        <!-- BARRA SUPERIOR Y MENÚ -->
        <div class="flex items-center justify-between">
            <a href="index_menu.html" class="px-4 py-2 bg-white/80 hover:bg-white text-slate-700 rounded-xl font-bold text-xs shadow-sm flex items-center gap-2 transition border border-slate-200">
                <i class="fas fa-arrow-left"></i> Volver al Menú
            </a>
            <span id="userEmail" class="text-xs font-bold text-slate-500">
                <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Cargando club...
            </span>
        </div>

        <!-- BANNER SUPERIOR CON GLOW -->
        <div class="banner-glow mb-2">
            <div class="rounded-3xl overflow-hidden shadow-2xl relative border border-white/60 bg-slate-950">
                <img src="img/banner.png" alt="Control Voley Banner" class="w-full h-36 sm:h-44 object-cover opacity-80" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1612872087720-bb876e2e67d1?q=80&w=1600&auto=format&fit=crop'">
                <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-transparent flex flex-col justify-center px-6 sm:px-10">
                    <span class="text-sky-400 text-xs font-extrabold uppercase tracking-widest flex items-center gap-2 mb-1">
                        <i class="fas fa-chart-line"></i> Scouting en Vivo
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-black text-white leading-tight">
                        Control Voley <span class="text-brand-cyan">Stats</span>
                    </h1>
                    <p class="text-slate-300 text-xs sm:text-sm mt-1 font-medium">
                        Registro de rendimiento, jugadas por set y métricas del partido.
                    </p>
                </div>
            </div>
        </div>

        <!-- CONTENEDOR DE ACCIONES Y ESTADÍSTICAS -->
        <div class="grid gap-6">
            
            <!-- REGISTRO DE ACCIÓN EN VIVO -->
            <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 pb-3 border-b border-slate-200">
                    <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 flex items-center gap-2">
                        <i class="fas fa-bolt text-brand-electric"></i> Registrar Acción de Juego
                    </h2>
                    
                    <!-- CONMUTADOR MODO REGISTRADO / MANUAL -->
                    <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button type="button" id="btnModoData" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-brand-electric text-white shadow-sm">
                            <i class="fas fa-database mr-1"></i> Nómina
                        </button>
                        <button type="button" id="btnModoManual" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900">
                            <i class="fas fa-user-pen mr-1"></i> Sin Registro / Invitado
                        </button>
                    </div>
                </div>

                <form id="f" class="space-y-3">
                    
                    <!-- SECCIÓN SELECCIÓN DE ATLETA (REGISTRADO) -->
                    <div id="seccionRegistrado">
                        <select id="ps" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm">
                            <option value="">Seleccione Atleta de la Nómina...</option>
                        </select>
                    </div>

                    <!-- SECCIÓN INGRESO MANUAL DE ATLETA (SIN REGISTRO) -->
                    <div id="seccionManual" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <input type="number" id="pN" placeholder="Nro Camiseta" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm">
                        </div>
                        <div class="sm:col-span-2">
                            <input type="text" id="pM" placeholder="Nombre o Apodo del Atleta" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm">
                        </div>
                    </div>

                    <!-- SELECCIÓN DE ACCIÓN -->
                    <div>
                        <select id="as" class="w-full border border-slate-200 p-3 rounded-xl bg-white text-xs font-bold text-slate-700 outline-none shadow-sm" required>
                            <option value="">Seleccione Acción de Juego...</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-brand-electric hover:bg-brand-600 text-white py-3.5 rounded-xl font-black text-xs uppercase tracking-wider shadow-electric transition cursor-pointer">
                        <i class="fas fa-plus-circle mr-1"></i> Registrar Jugada
                    </button>

                    <div class="grid grid-cols-2 gap-2 pt-2">
                        <button type="button" id="rs" class="bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-xl text-xs font-bold transition shadow-sm">Limpiar Set Actual</button>
                        <button type="button" id="ra" class="bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-xl text-xs font-bold transition shadow-sm">Reiniciar Partido</button>
                    </div>
                </form>
            </div>

            <!-- RESUMEN ESTADÍSTICO -->
            <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80">
                <h2 class="text-sm font-black uppercase tracking-wider text-slate-900 mb-3 pb-2 border-b border-slate-200 flex items-center gap-2">
                    <i class="fas fa-list-check text-brand-electric"></i> Rendimiento por Atleta
                </h2>
                <div id="st" class="space-y-2">
                    <p class="text-center text-slate-400 text-xs py-4">Cargando estadísticas...</p>
                </div>
            </div>

            <!-- GRÁFICAS -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 h-72">
                    <canvas id="c1"></canvas>
                </div>
                <div class="glass-card p-6 rounded-3xl shadow-glass border border-slate-200/80 h-72">
                    <canvas id="c2"></canvas>
                    <div id="sum" class="text-center mt-2 text-xs font-bold text-slate-600"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- SCRIPT DE SUPABASE Y LÓGICA DE ESTADÍSTICAS DUAL -->
    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

        const _ = id => document.getElementById(id);
        const empresaID = (localStorage.getItem('youcontrol_empresa_id') || '').trim();
        const clubNombre = localStorage.getItem('control_voley_club_nombre') || empresaID || 'Club Voley';

        let supaUrl = localStorage.getItem('control_voley_supa_url');
        let supaKey = localStorage.getItem('control_voley_supa_key');

        if (supaUrl) supaUrl = supaUrl.replace(/[\[\]]/g, '').trim();
        if (supaKey) supaKey = supaKey.replace(/[\[\]]/g, '').trim();

        if (!empresaID || !supaUrl || !supaKey) {
            alert("Sesión no autorizada o credenciales faltantes.");
            window.location.href = 'index.html';
        }

        const userEmailEl = _('userEmail');
        if (userEmailEl) {
            userEmailEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Club: ${clubNombre}`;
        }

        const supabase = createClient(supaUrl, supaKey);

        let L = []; // Atletas de la nómina
        let M_Manual = []; // Atletas añadidos manualmente sin registro
        let S = []; // Acciones del set actual
        let M = []; // Acciones totales del partido
        let modoManual = false;
        let b = null, a = null;

        const N = {
            'Servicio Bueno S#': 1, 'Ataque Bueno A#': 1, 'Bloqueo Bueno B#': 1, 'Coloque Bueno C#': 1,
            'Servicio Malo S=': -1, 'Ataque Malo A=': -1, 'Bloqueo Malo B=': -1, 'Recepción Mala R=': -1, 
            'Coloque Malo C=': -1, 'Defensa Mala D=': -1
        };
        const O = { S: 'Servicio', A: 'Ataque', B: 'Bloqueo', R: 'Recepción', C: 'Coloque', D: 'Defensa' };
        const P = { b: '#0055FF', r: '#dc2626', o: '#f97316', g: '#10b981' };
        const K = { scales: { y: { ticks: { stepSize: 1 } } }, responsive: true, maintainAspectRatio: false };

        // Cambio de Modo
        _('btnModoData').onclick = () => {
            modoManual = false;
            _('btnModoData').className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-brand-electric text-white shadow-sm';
            _('btnModoManual').className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900';
            _('seccionRegistrado').classList.remove('hidden');
            _('seccionManual').classList.add('hidden');
        };

        _('btnModoManual').onclick = () => {
            modoManual = true;
            _('btnModoManual').className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition bg-brand-electric text-white shadow-sm';
            _('btnModoData').className = 'px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-600 hover:text-slate-900';
            _('seccionManual').classList.remove('hidden');
            _('seccionRegistrado').classList.add('hidden');
        };

        async function cargarDatosIniciales() {
            try {
                const { data: atletas } = await supabase.from('atletas').select('*').order('nroCamiseta', { ascending: true });
                L = atletas || [];
                rP();

                S = JSON.parse(localStorage.getItem('vS_' + empresaID) || '[]');
                M = JSON.parse(localStorage.getItem('vM_' + empresaID) || '[]');
                M_Manual = JSON.parse(localStorage.getItem('vM_Manual_' + empresaID) || '[]');
                U();
            } catch (err) {
                console.error("Error al cargar atletas:", err);
            }
        }

        function rP() {
            const ps = _('ps');
            ps.innerHTML = '<option value="">Seleccione Atleta de la Nómina...</option>';
            L.forEach(p => {
                let o = document.createElement('option');
                o.value = p.cedulaIdentidad || p.number;
                o.textContent = `#${p.nroCamiseta || '0'} ${p.nombre} ${p.apellido || ''}`;
                ps.appendChild(o);
            });
        }

        const as = _('as');
        Object.keys(N).forEach(k => {
            let o = document.createElement('option');
            o.value = k;
            o.textContent = k;
            as.appendChild(o);
        });

        function G() {
            localStorage.setItem('vS_' + empresaID, JSON.stringify(S));
            localStorage.setItem('vM_' + empresaID, JSON.stringify(M));
            localStorage.setItem('vM_Manual_' + empresaID, JSON.stringify(M_Manual));
        }

        function U() {
            const s = _('st');
            s.innerHTML = '';

            let d = {};

            // 1. Cargar lista de atletas de la nómina
            L.forEach(p => {
                const key = p.cedulaIdentidad || p.number;
                d[key] = { p: 0, n: 0, a: {}, name: `${p.nombre} ${p.apellido || ''}`, num: p.nroCamiseta || '0' };
            });

            // 2. Cargar lista de atletas manuales agregados durante el partido
            M_Manual.forEach(p => {
                if (!d[p.key]) {
                    d[p.key] = { p: 0, n: 0, a: {}, name: p.name, num: p.num };
                }
            });

            // 3. Procesar las acciones registradas
            S.forEach(l => {
                let k = d[l.playerKey];
                if (k) {
                    let v = N[l.action], t = l.action.charAt(l.action.length - 2);
                    v > 0 ? k.p++ : k.n++;
                    if (!k.a[t]) k.a[t] = { p: 0, n: 0 };
                    v > 0 ? k.a[t].p++ : k.a[t].n++;
                }
            });

            const keysConParticipacion = Object.keys(d).filter(k => d[k].p > 0 || d[k].n > 0 || Object.keys(d[k].a).length > 0);

            if (!keysConParticipacion.length) {
                s.innerHTML = '<p class="text-center text-slate-400 text-xs py-3">Sin registros en el set actual.</p>';
            } else {
                keysConParticipacion.forEach(key => {
                    let k = d[key];
                    let dt = '';
                    Object.keys(k.a).forEach(x => dt += `<span class="mr-2 font-mono">${x}: <span class="text-emerald-600 font-bold">${k.a[x].p}</span>|<span class="text-rose-600 font-bold">${k.a[x].n}</span></span>`);
                    s.innerHTML += `
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                            <div class="flex justify-between font-black text-slate-800">
                                <span>#${k.num} ${k.name}</span>
                                <span class="px-2 py-0.5 rounded-lg ${k.p - k.n >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'}">Dif: ${k.p - k.n}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 mt-1">${dt}</div>
                        </div>`;
                });
            }

            // Gráficas Chart.js
            const x1 = _('c1').getContext('2d'), x2 = _('c2').getContext('2d'), l = Object.values(O);
            let v1 = { p: [0,0,0,0,0,0], n: [0,0,0,0,0,0] }, v2 = { p: [0,0,0,0,0,0], n: [0,0,0,0,0,0] }, tp = 0, tn = 0;

            const keys = Object.keys(O);
            keys.forEach((k, idx) => {
                let p = 0, n = 0, ap = 0, an = 0;
                S.forEach(z => { if (z.action.charAt(z.action.length - 2) === k) N[z.action] > 0 ? p++ : n++; });
                M.forEach(z => { 
                    if (z.action.charAt(z.action.length - 2) === k) {
                        if (N[z.action] > 0) { ap++; tp++; } else { an++; tn++; }
                    }
                });
                v1.p[idx] = p; v1.n[idx] = n;
                v2.p[idx] = ap; v2.n[idx] = an;
            });

            if (b) b.destroy();
            b = new Chart(x1, { type: 'bar', data: { labels: l, datasets: [{ label: 'Positivo (+)', data: v1.p, backgroundColor: P.b }, { label: 'Negativo (-)', data: v1.n, backgroundColor: P.o }] }, options: { ...K, plugins: { title: { display: true, text: 'SET ACTUAL' } } } });
            
            _('sum').innerHTML = `Total Partido — Positivos: <span class="text-emerald-600 font-bold">${tp}</span> | Negativos: <span class="text-rose-600 font-bold">${tn}</span>`;
            
            if (a) a.destroy();
            a = new Chart(x2, { type: 'bar', data: { labels: l, datasets: [{ label: 'Positivo (+)', data: v2.p, backgroundColor: P.g }, { label: 'Negativo (-)', data: v2.n, backgroundColor: P.o }] }, options: { ...K, plugins: { title: { display: true, text: 'TOTAL PARTIDO' } } } });
        }

        _('f').onsubmit = e => {
            e.preventDefault();
            let playerKey = "";

            if (!modoManual) {
                playerKey = _('ps').value;
                if (!playerKey) { alert("Por favor seleccione un atleta de la lista."); return; }
            } else {
                const num = _('pN').value.trim();
                const nom = _('pM').value.trim();

                if (!num || !nom) { alert("Por favor complete el número y el nombre del atleta."); return; }

                playerKey = "MANUAL_" + num;
                
                // Registrar atleta manual si no existía en este partido
                if (!M_Manual.some(x => x.key === playerKey)) {
                    M_Manual.push({ key: playerKey, num: num, name: nom });
                }
            }

            const accion = _('as').value;
            if (!accion) { alert("Por favor seleccione una acción de juego."); return; }

            let l = { playerKey: playerKey, action: accion };
            M.push(l);
            S.push(l);
            G();
            U();

            if (modoManual) {
                _('pN').value = '';
                _('pM').value = '';
            }
        };

        _('rs').onclick = () => {
            if (confirm('¿Desea limpiar los datos del set actual?')) { S = []; G(); U(); }
        };

        _('ra').onclick = () => {
            if (confirm('¿Desea reiniciar todo el partido y limpiar las estadísticas?')) {
                localStorage.removeItem('vS_' + empresaID);
                localStorage.removeItem('vM_' + empresaID);
                localStorage.removeItem('vM_Manual_' + empresaID);
                location.reload();
            }
        };

        cargarDatosIniciales();
    </script>
</body>
</html>
